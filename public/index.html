<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 운세 🌌 | 자영샘의 특급 후원</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 동양풍 산수화 배경 아트워크 레이어 (달, 첩첩산중, 전통 구름 및 굽이치는 파도) -->
  <div class="oriental-backdrop" aria-hidden="true">
    <div class="bg-mist"></div>
    <div class="bg-moon"></div>
    
    <!-- 산맥 및 원경 수묵 실루엣 -->
    <svg class="bg-svg bg-mountains" viewBox="0 0 1440 600" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mtnGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7a8b99" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#dfd7c5" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="mtnGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2d3f52" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#182430" stop-opacity="0.25"/>
        </linearGradient>
      </defs>
      <path d="M0,420 Q180,260 400,360 T800,300 T1200,270 T1440,340 L1440,600 L0,600 Z" fill="url(#mtnGradFar)"/>
      <path d="M0,460 Q240,300 520,400 T1000,320 T1440,370 L1440,600 L0,600 Z" fill="url(#mtnGradFar)"/>
      <path d="M-40,600 L-20,380 Q80,250 180,310 Q280,200 380,310 Q460,230 560,340 Q700,270 840,390 Q980,240 1120,350 Q1240,220 1360,320 L1460,340 L1460,600 Z" fill="url(#mtnGradMid)"/>
    </svg>

    <!-- 전통 구름 문양 -->
    <svg class="bg-svg bg-clouds" viewBox="0 0 1440 500" preserveAspectRatio="none">
      <path d="M70,130 Q100,110 130,125 Q150,100 180,115 Q210,105 230,130 Q245,150 220,165 Q200,175 170,170 Q140,180 110,170 Q80,175 65,155 Z" fill="#eeddbb" opacity="0.5"/>
      <path d="M1210,80 Q1240,60 1270,75 Q1290,50 1320,65 Q1350,55 1370,80 Q1385,100 1360,115 Q1340,125 1310,120 Q1280,130 1250,120 Q1220,125 1205,105 Z" fill="#eeddbb" opacity="0.45"/>
    </svg>

    <!-- 하단 전통 남색 파도와 금빛 물결선 -->
    <svg class="bg-svg bg-waves" viewBox="0 0 1440 280" preserveAspectRatio="none">
      <defs>
        <linearGradient id="waveDeep" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#142232"/>
          <stop offset="100%" stop-color="#080e16"/>
        </linearGradient>
        <linearGradient id="waveGold" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c5a059"/>
          <stop offset="50%" stop-color="#e9d3a0"/>
          <stop offset="100%" stop-color="#c5a059"/>
        </linearGradient>
      </defs>
      <path d="M0,110 C160,50 280,170 440,110 C600,50 720,170 880,110 C1040,50 1160,170 1320,110 C1380,85 1410,95 1440,105 L1440,280 L0,280 Z" fill="#1b2d40" opacity="0.9"/>
      <path d="M0,110 C160,50 280,170 440,110 C600,50 720,170 880,110 C1040,50 1160,170 1320,110 C1380,85 1410,95 1440,105" stroke="url(#waveGold)" stroke-width="2.5" fill="none" opacity="0.8"/>

      <path d="M0,150 C120,100 240,200 360,150 C480,100 600,200 720,150 C840,100 960,200 1080,150 C1200,100 1320,200 1440,150 L1440,280 L0,280 Z" fill="url(#waveDeep)"/>
      <path d="M0,150 C120,100 240,200 360,150 C480,100 600,200 720,150 C840,100 960,200 1080,150 C1200,100 1320,200 1440,150" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.7"/>

      <path d="M0,190 C80,160 160,220 240,190 C320,160 400,220 480,190 C560,160 640,220 720,190 C800,160 880,220 960,190 C1040,160 1120,220 1200,190 C1280,160 1360,220 1440,190 L1440,280 L0,280 Z" fill="#0b131e"/>
      <path d="M0,190 C80,160 160,220 240,190 C320,160 400,220 480,190 C560,160 640,220 720,190 C800,160 880,220 960,190 C1040,160 1120,220 1200,190 C1280,160 1360,220 1440,190" stroke="#e0c068" stroke-width="2" fill="none" opacity="0.9"/>
    </svg>

    <!-- 좌측 소나무 가지 & 우측 매화 꽃가지 장식 실루엣 -->
    <div class="oriental-branch branch-left"></div>
    <div class="oriental-branch branch-right"></div>
  </div>

  <!-- 배경 별빛 효과 -->
  <div class="stars-overlay" aria-hidden="true"></div>

  <div class="container">
    <!-- 헤더 / 타이틀 영역 -->
    <header class="hero-header">
      <div class="badge">자영샘의 특급 후원 ✨</div>
      <h1 class="main-title"><span class="glow-text">오늘의 운세</span></h1>
      <p class="subtitle">사주명식의 기운을 AI로 정밀 분석하여 오늘의 흐름과 행운 팁을 전해드립니다.</p>
    </header>

    <!-- 폼 카드 영역 -->
    <main class="main-card">
      <form id="fortuneForm" novalidate>
        <!-- 1. 이름 -->
        <div class="form-group">
          <label for="userName" class="form-label">이름</label>
          <input 
            type="text" 
            id="userName" 
            name="name" 
            class="form-input" 
            placeholder="이름을 입력하세요 (예: 홍길동)" 
            maxlength="20"
            required
          >
          <div class="error-msg" id="nameError"></div>
        </div>

        <!-- 2. 성별 -->
        <div class="form-group">
          <span class="form-label">성별</span>
          <div class="segmented-control" role="radiogroup" aria-label="성별 선택">
            <label class="segmented-option">
              <input type="radio" name="gender" value="남성" checked>
              <span class="segment-btn">남성</span>
            </label>
            <label class="segmented-option">
              <input type="radio" name="gender" value="여성">
              <span class="segment-btn">여성</span>
            </label>
          </div>
        </div>

        <!-- 3. 생년월일 & 양력/음력 -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="birthDate" class="form-label">생년월일</label>
            <input 
              type="date" 
              id="birthDate" 
              name="birthdate" 
              class="form-input" 
              required
            >
            <div class="error-msg" id="birthDateError"></div>
          </div>

          <div class="form-group">
            <span class="form-label">양력 / 음력</span>
            <div class="segmented-control" role="radiogroup" aria-label="양력 음력 선택">
              <label class="segmented-option">
                <input type="radio" name="calendarType" value="양력" checked>
                <span class="segment-btn">양력</span>
              </label>
              <label class="segmented-option">
                <input type="radio" name="calendarType" value="음력">
                <span class="segment-btn">음력</span>
              </label>
            </div>
          </div>
        </div>

        <!-- 4. 태어난 시 -->
        <div class="form-group">
          <label for="birthHour" class="form-label">태어난 시 (선택)</label>
          <div class="select-wrapper">
            <select id="birthHour" name="birthHour" class="form-select">
              <option value="모름">태어난 시 모름 (미상)</option>
              <option value="자시 (23:30 ~ 01:29)">자시 (子時 / 23:30 ~ 01:29)</option>
              <option value="축시 (01:30 ~ 03:29)">축시 (丑時 / 01:30 ~ 03:29)</option>
              <option value="인시 (03:30 ~ 05:29)">인시 (寅時 / 03:30 ~ 05:29)</option>
              <option value="묘시 (05:30 ~ 07:29)">묘시 (卯時 / 05:30 ~ 07:29)</option>
              <option value="진시 (07:30 ~ 09:29)">진시 (辰時 / 07:30 ~ 09:29)</option>
              <option value="사시 (09:30 ~ 11:29)">사시 (巳時 / 09:30 ~ 11:29)</option>
              <option value="오시 (11:30 ~ 13:29)">오시 (午時 / 11:30 ~ 13:29)</option>
              <option value="미시 (13:30 ~ 15:29)">미시 (未時 / 13:30 ~ 15:29)</option>
              <option value="신시 (15:30 ~ 17:29)">신시 (申時 / 15:30 ~ 17:29)</option>
              <option value="유시 (17:30 ~ 19:29)">유시 (酉時 / 17:30 ~ 19:29)</option>
              <option value="술시 (19:30 ~ 21:29)">술시 (戌時 / 19:30 ~ 21:29)</option>
              <option value="해시 (21:30 ~ 23:29)">해시 (亥時 / 21:30 ~ 23:29)</option>
            </select>
          </div>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" id="submitBtn" class="btn btn-primary">
          <span class="btn-text">운세 보기</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>

        <div id="formAlert" class="form-alert hidden" role="alert"></div>
      </form>
    </main>

    <!-- 결과 영역 (초기 숨김) -->
    <section id="resultSection" class="result-card hidden" aria-live="polite">
      <div class="result-header">
        <div class="result-tag">사주명식 풀이 결과</div>
        <h2 id="resultTitle" class="result-title">님을 위한 오늘의 운세</h2>
      </div>
      <div id="resultContent" class="result-body"></div>
      <div class="result-footer">
        <button type="button" id="retryBtn" class="btn btn-outline">다시 분석하기</button>
      </div>
    </section>

    <!-- 피드백 섹션 (화면 하단) -->
    <section class="feedback-section">
      <div class="feedback-header">
        <h2 class="section-title">익명 한줄 방명록 & 피드백 💬</h2>
        <p class="section-desc">진선의 운세 서비스는 어떠셨나요? 자유롭게 피드백을 남겨주세요 (로그인 불필요).</p>
      </div>

      <!-- 피드백 입력 폼 -->
      <form id="feedbackForm" class="feedback-form">
        <div class="feedback-input-wrapper">
          <textarea 
            id="feedbackContent" 
            class="feedback-textarea" 
            rows="3" 
            placeholder="진선에게 전할 따뜻한 응원이나 피드백을 적어주세요! (최대 500자)"
            maxlength="500"
            required
          ></textarea>
          <div class="feedback-form-bottom">
            <span id="feedbackCharCount" class="char-count">0 / 500자</span>
            <button type="submit" id="feedbackSubmitBtn" class="btn btn-secondary">
              <span class="btn-text">남기기</span>
              <span class="spinner-small hidden" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div id="feedbackAlert" class="feedback-alert hidden" role="alert"></div>
      </form>

      <!-- 피드백 목록 -->
      <div class="feedback-list-wrapper">
        <h3 class="list-heading">동기들의 최신 피드백 (<span id="feedbackTotalCount">0</span>)</h3>
        <div id="feedbackList" class="feedback-list">
          <div class="empty-placeholder">등록된 피드백을 불러오는 중입니다...</div>
        </div>
      </div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
      <p>제작: 진선 💫 | 본 서비스는 자영샘의 특급 후원과 OpenAI 사주 분석으로 운영됩니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
